name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -cover ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pp .

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifies the Docker image builds and the action wiring works end to end.
      - name: Build the action image
        run: docker build -t pp:ci .
