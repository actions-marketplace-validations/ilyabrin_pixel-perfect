name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Catches what vet does not: unused code, redundant conditions, misuse
      # of the standard library. Pinned so a new release cannot fail CI on an
      # unrelated commit; dependabot bumps it like any other action.
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: Test with race detector
        run: go test -race -cover ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pp .

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Verifies the Docker image builds and the action wiring works end to end.
      - name: Build the action image
        run: docker build -t pp:ci .
