name: 'Pixel Perfect'
description: 'Fast pixel-by-pixel image comparison for visual regression testing'
author: 'ilyabrin'

branding:
  icon: 'image'
  color: 'red'

inputs:
  base:
    description: 'Baseline image, or a directory of them'
    required: true
  current:
    description: 'Image under test, or a directory of them'
    required: true
  out:
    description: >-
      Where to write diff images; a directory when comparing directories.
      Nothing is written unless this is set.
    required: false
    default: ''
  threshold:
    description: 'Max per-channel delta (0-255) still counted as equal'
    required: false
    default: '0'
  fail-on:
    description: 'Fail the step when the diff ratio exceeds this fraction (0-1)'
    required: false
    default: '0'
  color:
    description: 'Highlight colour as RRGGBB'
    required: false
    default: 'FA0000'
  ignore-antialiasing:
    description: 'Treat antialiased edge pixels as equal (recommended for text-heavy pages)'
    required: false
    default: 'false'
  ignore:
    description: 'Regions to exclude as x,y,width,height, several separated by ";"'
    required: false
    default: ''

outputs:
  diff-pixels:
    description: 'Number of pixels that differ'
  diff-ratio:
    description: 'Fraction of pixels that differ, 0 to 1'
  failed:
    description: 'true when any comparison exceeded fail-on'
  compared:
    description: 'Number of image pairs compared'
  failed-count:
    description: 'Number of comparisons that failed'

runs:
  using: 'docker'
  # A prebuilt image starts in about two seconds; pointing at the Dockerfile
  # instead rebuilds it from source on every run of every workflow.
  image: 'docker://ghcr.io/ilyabrin/pixel-perfect:v1'
  args:
    - '-base'
    - ${{ inputs.base }}
    - '-current'
    - ${{ inputs.current }}
    - '-out'
    - ${{ inputs.out }}
    - '-threshold'
    - ${{ inputs.threshold }}
    - '-fail-on'
    - ${{ inputs.fail-on }}
    - '-color'
    - ${{ inputs.color }}
    - '-ignore-antialiasing=${{ inputs.ignore-antialiasing }}'
    - '-ignore=${{ inputs.ignore }}'
